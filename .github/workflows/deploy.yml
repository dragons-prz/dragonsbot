name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false # Never cancel a running deploy

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Write SSH key
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > /tmp/vps_key
          chmod 600 /tmp/vps_key

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: /tmp/vps_key
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e

            cd ${{ secrets.APP_DIR }}

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Building and restarting container..."
            docker compose up --build -d

            echo "==> Removing dangling images..."
            docker image prune -f

            echo "==> Deploy concluído: $(date)"
